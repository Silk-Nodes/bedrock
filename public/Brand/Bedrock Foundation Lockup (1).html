<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bedrock — Foundation Lockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ECE7D8;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 6vw;
  }
  .lockup-f { display: inline-flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .word {
    font-family: 'Archivo Black', system-ui, sans-serif; font-weight: 900;
    font-size: 144px; line-height: 0.85; letter-spacing: -0.058em;
    color: #15140F;
  }
  .topo { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="lockup-f">
    <div class="word">BEDROCK</div>
    <svg class="topo" height="64" viewBox="0 0 640 64" preserveAspectRatio="none">
      <path d="M0,64 L0,40 L60,28 L120,42 L180,20 L240,36 L300,16 L360,32 L420,12 L480,28 L540,18 L640,32 L640,64 Z" fill="#3B2A6B" fill-opacity="0.35"/>
      <path d="M0,64 L0,48 L66,44 L132,54 L198,30 L264,46 L330,28 L396,42 L462,22 L528,38 L580,30 L640,44 L640,64 Z" fill="#3B2A6B" fill-opacity="0.6"/>
      <path d="M0,64 L0,56 L72,52 L140,60 L208,42 L276,54 L342,40 L408,52 L474,36 L536,48 L584,42 L640,54 L640,64 Z" fill="#15140F"/>
      <polyline points="0,56 72,52 140,60 208,42 276,54 342,40 408,52 474,36 536,48 584,42 640,54" fill="none" stroke="#5B4A9A" stroke-width="1.2"/>
    </svg>
  </div>
</body>
</html>
